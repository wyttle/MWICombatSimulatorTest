name: Build and Deploy

on:
  push:
    branches: [testing]
  pull_request:
    branches: [testing]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # validateOptimizer.cjs 用 module.registerHooks 直接加载 ESM 源码，需要 22.15+。
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate guild shrine data
        run: npm run validate:guild-shrines

      - name: Validate MWI importer
        run: npm run validate:mwi-importer

      - name: Validate team optimizer
        run: npm run validate:optimizer

      - name: Build
        run: |
          export PUBLIC_PATH=/MWICombatSimulatorTest/
          npm run build

      - name: Verify build output
        run: |
          echo "=== Checking dist directory structure ==="
          ls -la ./dist/
          echo ""
          echo "=== Checking cache-busting query strings ==="
          # 主包与 js/ 下的脚本文件名固定，引用必须带内容 hash，否则升级后浏览器会继续跑缓存里的旧代码。
          grep -E 'src="[^"]*bundle\.js\?v=[0-9a-f]{8}"' ./dist/index.html
          grep -E 'src="[^"]*js/i18n\.js\?v=[0-9a-f]{8}"' ./dist/index.html
          echo ""
          echo "=== Checking bundle.js publicPath ==="
          grep -o '__webpack_require__\.p = "[^"]*"' ./dist/bundle.js | head -1


      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.ref == 'refs/heads/testing' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
