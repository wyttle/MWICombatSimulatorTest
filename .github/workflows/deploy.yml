name: Build and Deploy

on:
  push:
    branches: [testing]
  pull_request:
    branches: [testing]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_PATH: /MWICombatSimulatorTest/

      - name: Fix paths for GitHub Pages
        run: |
          sed -i 's|src="js/i18n.js"|src="/MWICombatSimulatorTest/js/i18n.js"|g' ./dist/index.html
          sed -i 's|src="bundle.js"|src="/MWICombatSimulatorTest/bundle.js"|g' ./dist/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.ref == 'refs/heads/testing' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
